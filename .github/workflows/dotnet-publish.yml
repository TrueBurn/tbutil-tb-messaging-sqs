name: .NET Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-nuget:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Pack TBUtil.MessagingSqs project
      run: dotnet pack TBUtil.MessagingSqs/TBUtil.MessagingSqs.csproj --configuration Release --no-build -o ./nuget_packages
      
    - name: Publish NuGet package
      run: dotnet nuget push ./nuget_packages/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
